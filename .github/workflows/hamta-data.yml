# Hämtar BritBox-utbudet varje natt och sparar det i data.json.
# Kan också köras för hand: Actions -> "Hämta data" -> Run workflow.
name: Hämta data

on:
  schedule:
    - cron: "17 4 * * *"   # varje dag ca 06:17 svensk tid
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/hamta.py
      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Uppdaterar data.json" && git push)
